name: Synapse Engine CI

on:
  push:
    branches: 
      - "main"
      - "dev"
  pull_request:
    branches: 
      - "main"
      - "dev"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120 
    
    env:
      VCPKG_ROOT: ${{ github.workspace }}/External/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_archives,readwrite"
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_archives
        key: ${{ matrix.os }}-vcpkg-archives-${{ hashFiles('**/xmake.lua') }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-archives-

    - name: Create vcpkg archives directory
      shell: bash
      run: mkdir -p ${{ github.workspace }}/vcpkg_archives

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-14 g++-14 build-essential pkg-config autoconf autoconf-archive \
          automake libtool m4 zip unzip curl nasm yasm libx11-dev \
          libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev \
          libxrender-dev libxtst-dev libxcb1-dev libx11-xcb-dev libgl1-mesa-dev \
          libxxf86vm-dev libwayland-dev libxkbcommon-dev

    - name: Install Xmake
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          choco install xmake -y
          echo "C:/Program Files/xmake" >> $GITHUB_PATH
          export PATH="/c/Program Files/xmake:$PATH"
          xmake update -s dev
        else
          curl -fsSL https://xmake.io/shget.text | bash
        fi

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        cd External/vcpkg
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./bootstrap-vcpkg.bat
        else
          ./bootstrap-vcpkg.sh
        fi

    - name: Setup MSVC Environment (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure and Build
      shell: bash
      run: |
        cd SynapseEngine

        if [ "$RUNNER_OS" == "Linux" ]; then
          export CC=gcc-14
          export CXX=g++-14
          xmake f -p linux -a x64 -m release --cc=gcc-14 --cxx=g++-14 -v -y
        else
          xmake f -p windows -a x64 --toolchain=msvc -m release -v -y
        fi
        
        xmake -v

    #- name: Run Unit Tests
    #  shell: bash
    #  run: |
    #    cd SynapseEngine
    #    xmake run UnitTests